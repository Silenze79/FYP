server.port=8081
spring.application.name=math-game-backend

# H2 database (file-based, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/mathgame;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=MathGameSecretKeyChangeInProductionMustBeAtLeast256BitsLong!!
app.jwt.expiration-ms=86400000

# Optional OpenAI key for AI teaching
openai.api-key=${OPENAI_API_KEY:}

# CORS
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
